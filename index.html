<style>
:root{
  --bg:#e8eaed; --panel:#ffffff; --ink:#202124; --muted:#5f6368; --line:#e8eaed; --soft:#f1f3f4; --hover:#f6f8fc;
  --brand:#1a73e8; --brand-ink:#ffffff; --brand-soft:#e8f0fe;
  --real:#188038; --real-bg:#e6f4ea; --est:#b06000; --est-bg:#fef7e0; --none:#c5221f; --none-bg:#fce8e6;
  --shadow:0 2px 6px rgba(60,64,67,.3),0 1px 2px rgba(60,64,67,.15);
  --shadow-lg:0 4px 16px rgba(60,64,67,.28);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#202124; --panel:#2d2e30; --ink:#e8eaed; --muted:#9aa0a6; --line:#3c4043; --soft:#3c4043; --hover:#35363a;
  --brand:#8ab4f8; --brand-ink:#202124; --brand-soft:#394457;
  --real:#81c995; --real-bg:#24372b; --est:#fdd663; --est-bg:#3c3524; --none:#f28b82; --none-bg:#4a2a28;
  --shadow:0 2px 6px rgba(0,0,0,.5); --shadow-lg:0 4px 16px rgba(0,0,0,.55);
}}
:root[data-theme="dark"]{
  --bg:#202124; --panel:#2d2e30; --ink:#e8eaed; --muted:#9aa0a6; --line:#3c4043; --soft:#3c4043; --hover:#35363a;
  --brand:#8ab4f8; --brand-ink:#202124; --brand-soft:#394457;
  --real:#81c995; --real-bg:#24372b; --est:#fdd663; --est-bg:#3c3524; --none:#f28b82; --none-bg:#4a2a28;
  --shadow:0 2px 6px rgba(0,0,0,.5); --shadow-lg:0 4px 16px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{font-family:'Noto Sans Lao','Phetsarath OT',Roboto,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
button{font:inherit;color:inherit}
svg{display:block}
#map{position:fixed;inset:0}
#map.placing .maplibregl-canvas{cursor:crosshair}

/* ---------- side panel (Google Maps results / place card) ---------- */
#panel{position:fixed;top:0;left:0;bottom:0;width:408px;z-index:5;background:var(--panel);box-shadow:var(--shadow-lg);
  display:flex;flex-direction:column;transition:transform .25s ease}
body.collapsed #panel{transform:translateX(-100%)}
#panelBody{flex:1;overflow-y:auto;padding-top:132px}
#toggle{position:absolute;top:50%;right:-23px;width:23px;height:48px;transform:translateY(-50%);border:0;border-left:1px solid var(--line);
  background:var(--panel);border-radius:0 8px 8px 0;box-shadow:var(--shadow);cursor:pointer;display:grid;place-items:center}
#toggle svg{width:18px;height:18px;fill:var(--muted);transition:transform .25s}
body.collapsed #toggle svg{transform:rotate(180deg)}
.handle{display:none}

/* search box + chips float above everything, like Google Maps */
#top{position:fixed;top:12px;left:12px;z-index:6;width:384px}
.searchbox{display:flex;align-items:center;height:48px;background:var(--panel);border-radius:24px;box-shadow:var(--shadow);padding:0 6px 0 4px}
.searchbox:focus-within{box-shadow:var(--shadow-lg)}
.iconbtn{width:40px;height:40px;border:0;background:none;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn:hover{background:var(--soft)}
.iconbtn svg{width:22px;height:22px;fill:var(--muted)}
.searchbox input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--ink);font:inherit;font-size:15px;padding:0 6px}
.searchbox input::placeholder{color:var(--muted)}
.logo{height:28px;width:auto;flex:none;margin:0 8px}
.brandrow{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.brandrow img{height:44px;width:auto}
.brandrow h1{border-left:1px solid var(--line);padding-left:12px}
/* the official logo files have a white backdrop: sit them on a white chip in dark mode */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) :is(.logo,.brandrow img,.gate-logo){background:#fff;border-radius:8px;padding:3px 6px}}
:root[data-theme="dark"] :is(.logo,.brandrow img,.gate-logo){background:#fff;border-radius:8px;padding:3px 6px}
.chips{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px;border:1px solid var(--line);border-radius:16px;background:var(--panel);
  box-shadow:var(--shadow);font-size:13px;font-weight:500;white-space:nowrap;cursor:pointer;flex:none}
.chip:hover{background:var(--hover)}
.chip svg{width:16px;height:16px;fill:currentColor}
.chip[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand);border-color:transparent}

/* results list */
.summary{padding:16px 24px 14px;border-bottom:1px solid var(--line)}
.summary h1{font-size:20px;font-weight:600;margin:0}
.summary p{margin:2px 0 12px;color:var(--muted);font-size:13px}
.bar{height:6px;border-radius:6px;background:var(--soft);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .r{background:var(--real)} .bar .e{background:#f9ab00} .bar .n{background:var(--none)}
.legend{display:flex;gap:14px;margin-top:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:50%}
.item{display:flex;gap:14px;width:100%;text-align:left;padding:14px 24px;border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer}
.item:hover{background:var(--hover)}
.item .info{flex:1;min-width:0}
.item h3{margin:0;font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .line{color:var(--muted);font-size:13px;margin-top:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.thumb{width:56px;height:56px;border-radius:10px;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;position:relative;overflow:hidden}
.thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.25),rgba(0,0,0,.15))}
.thumb span{position:relative;z-index:1}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:1px 8px;border-radius:10px;white-space:nowrap}
.pill.real{background:var(--real-bg);color:var(--real)}
.pill.est{background:var(--est-bg);color:var(--est)}
.pill.none{background:var(--none-bg);color:var(--none)}
.pill.closed{background:var(--soft);color:var(--muted)}
.item.off h3,.item.off .line{color:var(--muted)}
.item.off .thumb{opacity:.55}
.act.danger{color:var(--none)}
.act.danger svg{fill:var(--none)}
.act.danger:hover .ring{background:var(--none-bg)}
.closed-box{margin:16px 24px;padding:14px 16px;border-radius:12px;background:var(--soft)}
.closed-box p{margin:4px 0 6px;color:var(--muted);font-size:13px}
.closed-box .rk{grid-template-columns:10px 1fr auto}
.mk.closed{opacity:.55}
.mk.closed .lbl{text-decoration:line-through}
.fact a{color:inherit}
/* branch profile */
.prof{margin:12px 24px 4px;padding:14px 16px;border:1px solid var(--line);border-radius:12px}
.prof.locked p,.prof-empty,.prof-meta{color:var(--muted);font-size:13px;margin:6px 0 10px}
.prof-meta{margin:0;font-size:12px}
.prof-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.prof-head .btn{height:34px;font-size:13px}
.prof .facts{padding:4px 0}
.prof .fact{padding:8px 0;gap:16px}
.prof .fact a{color:var(--brand)}
.prof.form{display:flex;flex-direction:column;gap:10px}
.prof.form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600}
.prof.form input,.prof.form textarea{padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink);font:inherit;font-size:14px;font-weight:400;resize:vertical}
.prof.form input:focus,.prof.form textarea:focus{outline:2px solid var(--brand);outline-offset:-1px;background:var(--panel)}
.prof.form .probe-acts{padding:4px 0 0}
.photo-pick{cursor:pointer;border:1.5px dashed var(--line);border-radius:12px;min-height:120px;display:grid!important;place-items:center;overflow:hidden;background:var(--soft)}
.photo-pick img{width:100%;height:160px;object-fit:cover;display:block}
.photo-pick span{display:flex;align-items:center;gap:8px;color:var(--brand);font-size:14px}
.photo-pick svg{width:22px;height:22px;fill:var(--brand)}
.linkbtn{align-self:flex-start;border:0;background:none;color:var(--brand);font-weight:600;font-size:13px;cursor:pointer;padding:0}
.hero.photo::before{background:linear-gradient(0deg,rgba(0,0,0,.35),transparent 50%)}
.thumb.photo::after{display:none}
/* new customer */
.newc{border-top:8px solid var(--soft);margin-top:8px}
.warn{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--est-bg);color:var(--est);font-size:13px;margin:4px 0 8px}
.warn svg{width:18px;height:18px;fill:currentColor;flex:none;margin-top:1px}
.ok-note{margin:0;font-size:12.5px;color:var(--real)}
.rk.near{width:100%;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;font:inherit;color:inherit}
.rk.near:hover{background:var(--hover)}
.rk.near.same .nm{color:var(--est);font-weight:600}
.newc-form{margin:8px 24px 24px}
.newc-form select{padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink);font:inherit;font-size:14px}
.newc-form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.linkbtn.hit{display:block;margin:2px 0;text-align:left}
.empty{padding:40px 24px;text-align:center;color:var(--muted)}

/* customer → branch assessment */
.probe-form{display:flex;gap:8px;margin-top:4px}
.probe-form input{flex:1;min-width:0;height:42px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink);font:inherit}
.probe-form input:focus{outline:2px solid var(--brand);outline-offset:-1px;background:var(--panel)}
.btn{height:42px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn svg{width:18px;height:18px;fill:var(--brand)}
.btn.fill{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.fill:hover{filter:brightness(1.07)}
.field-label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:4px 0 6px}
.probe-tools{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.probe-tools .btn{flex:1;height:38px;font-size:13px;justify-content:center}
.verdict{margin:16px 24px;border-radius:14px;padding:16px;color:#fff;position:relative;overflow:hidden}
.verdict::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 90% 10%,rgba(255,255,255,.3),transparent 60%),linear-gradient(0deg,rgba(0,0,0,.25),transparent)}
.verdict>*{position:relative}
.verdict small{opacity:.9;font-size:12.5px}
.verdict h2{margin:2px 0 8px;font-size:22px}
.conf{display:inline-block;padding:2px 10px;border-radius:12px;background:rgba(255,255,255,.25);font-size:12.5px;font-weight:600}
.verdict p{margin:10px 0 0;font-size:13px;opacity:.95}
.verdict.out{background:var(--soft);color:var(--ink)}
.verdict.out::before{display:none}
.rank{padding:4px 24px 8px}
.rank h3{font-size:13px;color:var(--muted);font-weight:600;margin:8px 0}
.rk{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.rk .dot{width:10px;height:10px;border-radius:50%}
.rk .meter{height:6px;border-radius:6px;background:var(--soft);margin-top:4px;overflow:hidden}
.rk .meter i{display:block;height:100%;border-radius:6px}
.rk small{color:var(--muted);font-size:12px}
.rk b{font-size:14px}
.probe-acts{display:flex;gap:8px;padding:8px 24px 20px}
.probe-acts .btn{flex:1;justify-content:center}
.howto{margin:0 24px 20px;font-size:12.5px;color:var(--muted)}

/* place card */
.hero{height:180px;position:relative;display:flex;align-items:flex-end;padding:16px 24px;color:#fff;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 20%,rgba(255,255,255,.35),transparent 55%),linear-gradient(0deg,rgba(0,0,0,.45),transparent 70%)}
.hero svg{position:absolute;right:20px;top:24px;width:72px;height:72px;fill:rgba(255,255,255,.85)}
.back{position:absolute;top:12px;left:12px;z-index:1;background:rgba(0,0,0,.35)!important}
.back svg{position:static;width:22px;height:22px;fill:#fff}
.place{padding:16px 24px 8px}
.place h2{margin:0;font-size:22px;font-weight:600}
.place .line{color:var(--muted);font-size:14px;margin-top:4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.actions{display:flex;justify-content:space-around;padding:12px 12px 16px;border-bottom:1px solid var(--line)}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;cursor:pointer;font-size:12px;color:var(--brand);width:76px;text-decoration:none}
.act .ring{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center}
.act.primary .ring{background:var(--brand);border-color:var(--brand)}
.act svg{width:20px;height:20px;fill:var(--brand)}
.act.primary svg{fill:var(--brand-ink)}
.act:hover .ring{background:var(--brand-soft)}
.act.primary:hover .ring{filter:brightness(1.08);background:var(--brand)}
.facts{padding:8px 0}
.fact{display:flex;align-items:center;gap:20px;padding:12px 24px;font-size:14px}
.fact svg{width:22px;height:22px;fill:var(--brand);flex:none}
.fact small{display:block;color:var(--muted);font-size:12px}
.tip{margin:8px 24px 20px;padding:12px 14px;border-radius:10px;background:var(--soft);color:var(--muted);font-size:13px}

/* ---------- map controls ---------- */
.fab{position:fixed;z-index:4;background:var(--panel);border:0;border-radius:8px;box-shadow:var(--shadow);cursor:pointer;display:grid;place-items:center}
.fab svg{width:22px;height:22px;fill:var(--muted)}
.fab:hover svg{fill:var(--ink)}
#zoom{position:fixed;right:12px;bottom:24px;z-index:4;display:flex;flex-direction:column;gap:10px;align-items:center}
#zoom .fab{position:static;width:40px;height:40px}
.zgroup{display:flex;flex-direction:column;background:var(--panel);border-radius:8px;box-shadow:var(--shadow);overflow:hidden}
.zgroup button{width:40px;height:40px;border:0;background:none;cursor:pointer;display:grid;place-items:center}
.zgroup button+button{border-top:1px solid var(--line)}
.zgroup button:hover{background:var(--hover)}
.zgroup svg{width:20px;height:20px;fill:var(--muted)}
#compass svg{transition:transform .2s}

#layers{position:fixed;left:424px;bottom:24px;z-index:4;display:flex;gap:8px;align-items:flex-end;transition:left .25s}
body.collapsed #layers{left:36px}
.layer{width:74px;height:74px;border-radius:10px;border:2px solid var(--panel);box-shadow:var(--shadow);cursor:pointer;padding:0;position:relative;overflow:hidden;background:var(--soft)}
.layer span{position:absolute;left:0;right:0;bottom:0;padding:3px;font-size:11px;font-weight:600;color:#fff;background:linear-gradient(0deg,rgba(0,0,0,.65),transparent)}
.layer[aria-pressed="true"]{border-color:var(--brand)}
.layer.t-map{background:linear-gradient(135deg,#e8f0d8 0 35%,#fff 35% 40%,#aadaff 40% 60%,#f8f4ec 60%)}
.layer.t-clean{background:linear-gradient(135deg,#f5f5f5 0 45%,#dfe3e6 45% 50%,#cfd8dc 50%)}
.layer.t-dark{background:linear-gradient(135deg,#242f3e 0 45%,#38414e 45% 52%,#17263c 52%)}
.layer.t-sat{background:radial-gradient(circle at 30% 30%,#5d7a46,#2f4a2a 60%,#22331f)}
#layerMenu{display:none;gap:8px;background:var(--panel);padding:8px;border-radius:12px;box-shadow:var(--shadow-lg)}
#layerMenu.open{display:flex}
#layerMenu .layer{width:64px;height:64px;box-shadow:none;border-color:var(--line)}
#layerMenu .layer[aria-pressed="true"]{border-color:var(--brand)}

#download{position:fixed;top:12px;right:12px;z-index:4;display:flex;align-items:center;gap:8px;height:40px;padding:0 18px 0 14px;border:0;border-radius:20px;
  background:var(--panel);color:var(--brand);font-weight:600;font-size:14px;box-shadow:var(--shadow);cursor:pointer}
#download svg{width:20px;height:20px;fill:currentColor}
#download:hover{background:var(--hover)}

#banner{position:fixed;top:72px;left:50%;transform:translateX(calc(-50% + 204px));z-index:6;display:none;align-items:center;gap:12px;
  background:#202124;color:#fff;padding:8px 8px 8px 18px;border-radius:24px;box-shadow:var(--shadow-lg);font-size:14px;font-weight:500}
body.collapsed #banner{transform:translateX(-50%)}
#banner.show{display:flex}
#banner button{border:0;background:none;color:#8ab4f8;font-weight:600;padding:6px 12px;border-radius:16px;cursor:pointer}
#banner button:hover{background:rgba(138,180,248,.15)}
#toast{position:fixed;bottom:24px;left:50%;transform:translate(calc(-50% + 204px),16px);z-index:6;opacity:0;pointer-events:none;
  background:#323232;color:#fff;padding:12px 20px;border-radius:6px;font-size:14px;box-shadow:var(--shadow-lg);transition:.2s}
body.collapsed #toast{transform:translate(-50%,16px)}
#toast.show{opacity:1;transform:translate(calc(-50% + 204px),0)}
body.collapsed #toast.show{transform:translate(-50%,0)}

/* markers: Google-style pin + label */
.mk{display:flex;align-items:center;gap:2px;cursor:pointer}
.mk .pin{width:28px;height:38px;flex:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35));transition:transform .15s;transform-origin:50% 100%}
.mk:hover .pin,.mk.sel .pin{transform:scale(1.2)}
.mk .lbl{font-size:12.5px;font-weight:700;color:var(--ink);white-space:nowrap;margin-bottom:14px;
  text-shadow:0 0 3px var(--panel),0 0 3px var(--panel),0 0 3px var(--panel),0 0 3px var(--panel);display:none}
body.labels .mk .lbl,.mk.sel .lbl,.mk:hover .lbl{display:block}
.maplibregl-ctrl-attrib{font-size:10px}
/* PIN gate (web build) */
#gate{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:var(--bg)}
#gate[hidden]{display:none}
.gate-card{width:100%;max-width:360px;background:var(--panel);border-radius:18px;box-shadow:var(--shadow-lg);padding:28px 24px;display:flex;flex-direction:column;gap:10px}
.gate-logo{height:56px;width:auto;align-self:flex-start}
.gate-card h1{margin:0;font-size:22px}
.gate-card p{margin:0;color:var(--muted);font-size:13.5px}
.gate-card label{font-size:12.5px;font-weight:600;color:var(--muted);margin-top:6px}
.gate-card input{height:48px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--soft);color:var(--ink);font:inherit;font-size:20px;letter-spacing:6px}
.gate-card input:focus{outline:2px solid var(--brand);outline-offset:-1px;background:var(--panel)}
.gate-btn{height:48px;border:0;border-radius:12px;background:var(--brand);color:var(--brand-ink);font:inherit;font-weight:700;font-size:15px;cursor:pointer}
.gate-btn:disabled{opacity:.6;cursor:wait}
.gate-msg{min-height:20px;color:var(--none)!important;font-weight:600}
/* customer card popup */
.cust-pop .maplibregl-popup-content{background:var(--panel);color:var(--ink);border-radius:14px;box-shadow:var(--shadow-lg);padding:14px 16px 12px;font-family:inherit}
.cust-pop .maplibregl-popup-tip{border-top-color:var(--panel)!important;border-bottom-color:var(--panel)!important}
.cust-pop .maplibregl-popup-close-button{font-size:20px;color:var(--muted);right:6px;top:4px}
.cc-top{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
.cc-top .dot{width:10px;height:10px;border-radius:50%}
.cc h3{margin:4px 0 0;font-size:16px;padding-right:16px}
.cc-code{font-size:12px;color:var(--muted)}
.cc dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:10px 0;font-size:13px}
.cc dt{color:var(--muted)}
.cc dd{margin:0;font-weight:500}
.cc-acts{display:flex;gap:8px}
.cc-acts .btn{flex:1;height:36px;justify-content:center;text-decoration:none;font-size:13px}
.maplibregl-ctrl-bottom-right{right:60px}

/* ---------- phone: bottom sheet ---------- */
@media (max-width:760px){
  #top{left:12px;right:12px;width:auto}
  #panel{top:auto;width:auto;right:0;height:46vh;border-radius:16px 16px 0 0;transition:height .25s ease}
  body.expanded #panel{height:88vh}
  body.collapsed #panel{transform:none;height:96px}
  #panelBody{padding-top:0}
  #toggle{display:none}
  .handle{display:block;width:100%;border:0;background:none;padding:10px 0 4px;cursor:pointer;flex:none}
  .handle i{display:block;width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto}
  #layers,body.collapsed #layers{left:12px;bottom:calc(46vh + 12px)}
  #zoom{bottom:calc(46vh + 12px)}
  body.collapsed #layers{bottom:108px} body.collapsed #zoom{bottom:108px}
  body.expanded #layers,body.expanded #zoom,body.expanded #download{display:none}
  .layer{width:56px;height:56px}
  /* 44 px touch targets on phones */
  .iconbtn,#zoom .fab,.zgroup button{width:44px;height:44px}
  #download{height:44px}
  #download{top:auto;bottom:calc(46vh + 12px);right:64px;height:40px;padding:0 14px}
  #download .txt{display:none}
  body.collapsed #download{bottom:108px}
  #banner,body.collapsed #banner{top:112px;transform:translateX(-50%);max-width:calc(100% - 24px)}
  #toast,body.collapsed #toast{transform:translate(-50%,16px);bottom:calc(46vh + 70px)}
  #toast.show,body.collapsed #toast.show{transform:translate(-50%,0)}
  .hero{height:130px}
  .maplibregl-ctrl-scale{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

// ---------- base map styles (free, no API key) ----------
// OSM raster tiles are drawn server-side with proper Lao text shaping, so street names read correctly in Lao.
// The vector style's fonts miss some Lao characters (shown as boxes), so it is kept only as an English option.
const raster = (tiles, attribution, paint = {}) => ({
  version: 8, sources: {base: {type: 'raster', tileSize: 256, maxzoom: 19, attribution, tiles: [tiles]}},
  layers: [{id: 'base', type: 'raster', source: 'base', paint}]
});
const OSM = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png', OSM_ATTR = '&copy; OpenStreetMap';
const STYLES = {
  map: {name: 'ແຜນທີ່', cls: 't-map', style: raster(OSM, OSM_ATTR, {'raster-saturation': -0.35, 'raster-contrast': -0.05})},
  dark: {name: 'ກາງຄືນ', cls: 't-dark', style: raster(OSM, OSM_ATTR,
    {'raster-brightness-min': 1, 'raster-brightness-max': 0.08, 'raster-hue-rotate': 180, 'raster-saturation': -0.6, 'raster-contrast': 0.1})},
  sat: {name: 'ດາວທຽມ', cls: 't-sat', style: raster('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', 'Imagery &copy; Esri')},
  clean: {name: 'ສະອາດ (EN)', cls: 't-clean', style: 'https://tiles.openfreemap.org/styles/positron'}
};
let styleKey = dark ? 'dark' : 'map';

const map = new maplibregl.Map({
  container: 'map', style: STYLES[styleKey].style, center: [102.62, 17.965], zoom: 11.6,
  attributionControl: {compact: true}, dragRotate: true,
  locale: {'AttributionControl.ToggleAttribution': 'ສະແດງແຫຼ່ງຂໍ້ມູນແຜນທີ່', 'ScaleControl.Meters': 'ມ', 'ScaleControl.Kilometers': 'ກມ',
    'Popup.Close': 'ປິດ', 'Marker.Title': 'ໝຸດ'}
});
map.addControl(new maplibregl.ScaleControl({unit: 'metric'}), 'bottom-right');

// customer dots as one GeoJSON layer (fast for 6k+ points)
const dotsGeo = {type: 'FeatureCollection', features: DATA.points.map(([la, ln, i], k) => (
  {type: 'Feature', properties: {b: i, c: color(i), k}, geometry: {type: 'Point', coordinates: [ln, la]}}))};
let showDots = true, selected = null, placing = null, filter = 'all', view = 'list';
let probeGeo = {type: 'FeatureCollection', features: []}, probe = null, picking = false, probeMarker = null;

const dotColor = () => {
  const off = B.flatMap((b, i) => isClosed(b) ? [i] : []);
  return off.length ? ['case', ['in', ['get', 'b'], ['literal', off]], GREY, ['get', 'c']] : ['get', 'c'];
};
function dotOpacity() {
  return selected === null ? .7 : ['case', ['==', ['get', 'b'], selected], .9, .08];
}
map.on('style.load', () => {
  // vector style only: its fonts can't draw all Lao characters, so use English names there
  map.getStyle().layers.forEach(l => {
    if (l.type === 'symbol' && l.layout && l.layout['text-field'])
      map.setLayoutProperty(l.id, 'text-field', ['coalesce', ['get', 'name:en'], ['get', 'name_en'], ['get', 'name:latin'], ['get', 'name']]);
  });
  map.addSource('dots', {type: 'geojson', data: dotsGeo});
  map.addLayer({id: 'dots', type: 'circle', source: 'dots', layout: {visibility: showDots ? 'visible' : 'none'}, paint: {
    'circle-color': dotColor(), 'circle-opacity': dotOpacity(), 'circle-stroke-opacity': dotOpacity(),
    'circle-radius': ['interpolate', ['linear'], ['zoom'], 10, 1.6, 13, 3, 16, 6],
    'circle-stroke-width': ['interpolate', ['linear'], ['zoom'], 12, 0, 15, 1], 'circle-stroke-color': 'rgba(255,255,255,.8)'}});
  map.addSource('probe', {type: 'geojson', data: probeGeo});
  map.addLayer({id: 'probe-lines', type: 'line', source: 'probe', filter: ['==', '$type', 'LineString'],
    paint: {'line-color': ['get', 'c'], 'line-width': 2, 'line-opacity': .8}});
  map.addLayer({id: 'probe-near', type: 'circle', source: 'probe', filter: ['==', '$type', 'Point'],
    paint: {'circle-color': ['get', 'c'], 'circle-radius': 6, 'circle-stroke-width': 2, 'circle-stroke-color': '#fff'}});
});
const setDots = () => {
  if (!map.getLayer('dots')) return;
  map.setPaintProperty('dots', 'circle-color', dotColor());
  map.setPaintProperty('dots', 'circle-opacity', dotOpacity());
  map.setPaintProperty('dots', 'circle-stroke-opacity', dotOpacity());
};

// ---------- branch markers ----------
const pinSvg = (c, real) => `<svg class="pin" viewBox="0 0 28 38"><path d="M14 1C7 1 1.5 6.4 1.5 13.3 1.5 22.5 14 37 14 37s12.5-14.5 12.5-23.7C26.5 6.4 21 1 14 1z"
  fill="${c}" stroke="#fff" stroke-width="2" ${real ? '' : 'stroke-dasharray="3 2.4"'}/><circle cx="14" cy="13.3" r="4.6" fill="#fff" fill-opacity=".92"/></svg>`;
function markerEl(b, i) {
  const el = document.createElement('div');
  el.className = 'mk' + (isClosed(b) ? ' closed' : '');
  el.innerHTML = pinSvg(colorOf(i), b['ທີ່ມາ'] === REAL) + '<span class="lbl"></span>';
  el.querySelector('.lbl').textContent = short(b['ສາຂາ']);
  el.title = b['ສາຂາ'];
  el.addEventListener('click', e => {
    if (placing !== null) return; // let the click reach the map so the pin can be placed here
    e.stopPropagation();
    open(i, false);
  });
  return el;
}
function setReal(b, ll) { Object.assign(b, {Lat: +ll.lat.toFixed(6), Lng: +ll.lng.toFixed(6), 'ທີ່ມາ': REAL}); }
function addMarker(i) {
  const b = B[i];
  const m = new maplibregl.Marker({element: markerEl(b, i), anchor: 'bottom-left', offset: [-14, 0], draggable: true})
    .setLngLat([b.Lng, b.Lat]).addTo(map);
  m.on('dragend', () => { setReal(b, m.getLngLat()); redraw(i); toast(`ອັບເດດ ${short(b['ສາຂາ'])} ເປັນພິກັດຈິງ`); });
  return m;
}
const markers = B.map((b, i) => b.Lat === '' ? null : addMarker(i));
function redraw(i) {
  if (markers[i]) {
    const el = markers[i].getElement();
    el.querySelector('.pin').outerHTML = pinSvg(colorOf(i), B[i]['ທີ່ມາ'] === REAL);
    el.classList.toggle('sel', selected === i);
  }
  render();
}
map.on('zoom', () => document.body.classList.toggle('labels', map.getZoom() >= 13.5));

// ---------- tap a customer dot → customer card ----------
const custPopup = new maplibregl.Popup({closeButton: true, maxWidth: '300px', offset: 8, className: 'cust-pop'});
function custCard(k) {
  const v = Object.fromEntries(DATA.infoCols.map((c, j) => [c, DATA.info[k][j]]));
  const [la, ln, i] = DATA.points[k];
  const row = (label, val) => val ? `<dt>${label}</dt><dd>${esc(val)}</dd>` : '';
  const tel = firstTel(v['ເບີໂທ']);
  return `<div class="cc">
    <div class="cc-top"><span class="dot" style="background:${colorOf(i)}"></span><span>${esc(B[i]['ສາຂາ'])}</span></div>
    <h3>${esc(v['ຊື່ລູກຄ້າ'] || 'ບໍ່ມີຊື່')}</h3>
    <div class="cc-code">${esc(v['ລະຫັດລູກຄ້າ'])}</div>
    <dl>${row('ເບີໂທ', v['ເບີໂທ'])}${row('ບ້ານ', v['ບ້ານ'])}${row('ເມືອງ', v['ເມືອງ'])}
      ${row('ຄວາມຖີ່', v['ຄວາມຖີ່/ອາທິດ'] && v['ຄວາມຖີ່/ອາທິດ'] + ' ຄັ້ງ/ອາທິດ')}${row('ຖັງ/ຮອບ', v['ສົ່ງ (ຖັງ)/ຮອບ'])}
      ${row('ສິນຄ້າ', v['ຜະລິດຕະພັນ'])}${row('ຊື້ລ່າສຸດ', v['ວັນຊື້ລ່າສຸດ'])}${row('ໂຊນ / ວັນສົ່ງ', [v['ແຜນ/ໂຊນ'], v['ວັນ']].filter(Boolean).join(' · '))}
      ${row('ຜູ້ຮັບຜິດຊອບ', v['ຜູ້ຮັບຜິດຊອບ'])}</dl>
    <div class="cc-acts">
      ${tel ? `<a class="btn fill" href="tel:${tel}">ໂທ</a>` : ''}
      <a class="btn" href="https://www.google.com/maps/dir/?api=1&destination=${la},${ln}" target="_blank" rel="noopener">ເສັ້ນທາງ</a>
    </div></div>`;
}
map.on('click', 'dots', e => {
  if (placing !== null || picking) return; // the click is for placing a pin / picking a spot
  const f = e.features[0];
  if (isPhone()) map.easeTo({center: f.geometry.coordinates, padding: pad(), duration: 300}); // keep the card above the bottom sheet
  custPopup.setLngLat(f.geometry.coordinates).setHTML(custCard(f.properties.k)).addTo(map);
});
map.on('mouseenter', 'dots', () => { if (placing === null && !picking) map.getCanvas().style.cursor = 'pointer'; });
map.on('mouseleave', 'dots', () => { map.getCanvas().style.cursor = ''; });

// where a closed branch's customers would go: re-run the assessment for each, ignoring the closed branches
const reassignCache = new Map(); // cleared whenever a branch is closed or reopened
function reassign(i) {
  if (reassignCache.has(i)) return reassignCache.get(i);
  const to = {};
  DATA.points.forEach(p => {
    if (p[2] !== i) return;
    const r = assess(p[0], p[1], p);
    const k = r.ranked.length ? r.ranked[0].i : -1;
    to[k] = (to[k] || 0) + 1;
  });
  const out = Object.entries(to).map(([k, n]) => ({i: +k, n})).sort((a, b) => b.n - a.n);
  reassignCache.set(i, out);
  return out;
}

function toggleClosed(i) {
  const b = B[i], closing = !isClosed(b);
  if (closing && !confirm(`ແຈ້ງປິດ ${b['ສາຂາ']}?\n\nສາຂານີ້ຈະບໍ່ຖືກນັບໃນການປະເມີນສາຂາຂອງລູກຄ້າ. ຂໍ້ມູນບໍ່ຖືກລຶບ, ກົດ ເປີດຄືນ ໄດ້ທຸກເວລາ.`)) return;
  b['ສະຖານະ'] = closing ? CLOSED : OPEN;
  reassignCache.clear();
  if (markers[i]) {
    markers[i].getElement().classList.toggle('closed', closing);
    markers[i].getElement().querySelector('.pin').outerHTML = pinSvg(colorOf(i), b['ທີ່ມາ'] === REAL);
  }
  setDots();
  render();
  toast(closing ? `ແຈ້ງປິດ ${short(b['ສາຂາ'])} ແລ້ວ. ກົດ ດາວໂຫຼດ CSV ເພື່ອບັນທຶກ` : `ເປີດ ${short(b['ສາຂາ'])} ຄືນແລ້ວ`);
}

function renderPlace(i) {
  const b = B[i], has = b.Lat !== '', off = isClosed(b);

// phone photos are large: scale to max 1600 px JPEG before upload (base64 without the data: prefix)
function shrink(file) {
  return new Promise(res => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', .85).split(',')[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(url); res(null); };
    img.src = url;
  });
}

// ---------- which branch does a customer location belong to? ----------
// Distance-weighted vote of the nearest existing customers: their branch shows whose delivery zone this spot is in.
const K = 20, MAX_KM = 3;
const km = (a, b, c, d) => 111.32 * Math.hypot(a - c, (b - d) * Math.cos(a * Math.PI / 180));
function assess(lat, lng, exclude = null) {
  const near = []; // the K nearest so far, kept sorted (no full sort: closing a big branch runs this thousands of times)
  for (const p of DATA.points) {
    if (p === exclude || isClosed(B[p[2]])) continue;
    const d = km(lat, lng, p[0], p[1]);
    if (near.length === K && d >= near[K - 1].d) continue;
    let j = near.length < K ? near.length : K - 1;
    while (j > 0 && near[j - 1].d > d) { near[j] = near[j - 1]; j--; }
    near[j] = {p, d};
  }
  const used = near.filter(n => n.d <= MAX_KM);
  const score = {}, count = {};
  used.forEach(n => {
    score[n.p[2]] = (score[n.p[2]] || 0) + 1 / Math.max(n.d, .05); // closer customers count more
    count[n.p[2]] = (count[n.p[2]] || 0) + 1;
  });
  const total = Object.values(score).reduce((a, b) => a + b, 0);
  const ranked = Object.keys(score).map(i => ({i: +i, share: score[i] / total, n: count[i]})).sort((a, b) => b.share - a.share);
  return {used, ranked, nearest: near[0]};
}

// accepts "17.96, 102.6", Google Maps links with @lat,lng / q=lat,lng / !3dlat!4dlng
function parseCoords(s) {
  s = String(s || '').trim();
  try { s = decodeURIComponent(s); } catch (_) { /* stray % in typed text: use it as is */ }
  const pats = [/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/, /@(-?\d+\.\d+),(-?\d+\.\d+)/, /[?&](?:q|query|destination|ll)=(-?\d+\.\d+),\s*(-?\d+\.\d+)/, /^(-?\d+(?:\.\d+)?)\s*[,\s]\s*(-?\d+(?:\.\d+)?)$/];
  for (const re of pats) {
    const m = s.match(re);
    if (!m) continue;
    let a = +m[1], b = +m[2];
    if (a > 90) [a, b] = [b, a]; // pasted as lng,lat
    if (a > 13 && a < 23 && b > 100 && b < 108) return {lat: a, lng: b};
  }
  return null;
}

function runProbe(lat, lng) {
  if (selected !== null) { // leaving a place card: drop its highlight
    if (markers[selected]) markers[selected].getElement().classList.remove('sel');
    selected = null;
    setDots();
  }
  const res = assess(lat, lng);
  probe = {lat, lng, res};
  probeGeo = {type: 'FeatureCollection', features: res.used.flatMap(({p}) => [
    {type: 'Feature', properties: {c: color(p[2])}, geometry: {type: 'LineString', coordinates: [[lng, lat], [p[1], p[0]]]}},
    {type: 'Feature', properties: {c: color(p[2])}, geometry: {type: 'Point', coordinates: [p[1], p[0]]}}])};
  if (map.getSource('probe')) map.getSource('probe').setData(probeGeo);
  if (!probeMarker) probeMarker = new maplibregl.Marker({color: '#1a73e8'});
  probeMarker.setLngLat([lng, lat]).addTo(map);
  view = 'probe';
  $('probeChip').setAttribute('aria-pressed', true);
  body.classList.remove('collapsed');
  render();
  const far = res.used.length ? res.used[res.used.length - 1].d : 2; // km to the farthest neighbour used

const PIDX = new Map(DATA.points.map((p, k) => [p, k]));
const infoOf = k => Object.fromEntries(DATA.infoCols.map((c, j) => [c, DATA.info[k][j]]));
const phoneKey = s => String(s || '').replace(/\D/g, '').slice(-8); // last 8 digits: ignores 856 / 020 prefixes
const phoneKeys = s => String(s || '').split(/[\/,;|]|\s{2,}/).map(phoneKey).filter(k => k.length === 8);
const SAME_SPOT_KM = .05;
const mostCommon = arr => {
  const c = {}; arr.filter(Boolean).forEach(v => c[v] = (c[v] || 0) + 1);
  return Object.entries(c).sort((a, b) => b[1] - a[1])[0]?.[0] || '';
};
const NEW_KEY = 'vari_new_customers';
let newDraft = null; // unsaved new-customer form {spot, values}
// n nearest customers over every point (the vote in assess() skips closed branches; duplicate checks must not)
function nearestAll(lat, lng, n) {
  const best = [];
  DATA.points.forEach((p, k) => {
    const d = km(lat, lng, p[0], p[1]);
    if (best.length === n && d >= best[n - 1].d) return;
    let j = best.length < n ? best.length : n - 1;
    while (j > 0 && best[j - 1].d > d) { best[j] = best[j - 1]; j--; }
    best[j] = {k, d};
  });
  return best;
}
const newList = () => { try { return JSON.parse(store.get(NEW_KEY) || '[]'); } catch (_) { return []; } };

function downloadNew() {
  const cols = ['name', 'phone', 'branch', 'zone', 'day', 'lat', 'lng', 'maps', 'note', 'saved_at'];
  // typed text starting with = + - @ would run as an Excel formula; phone keeps its leading 0 as ="020..."
  const cell = (k, v) => k === 'phone' && v ? `="${String(v).replace(/"/g, '')}"` : typeof v === 'string' && /^[=+\-@\t\r]/.test(v) ? "'" + v : v;
  const head = ['ຊື່ລູກຄ້າ', 'ເບີໂທ', 'ສາຂາ', 'ແຜນ/ໂຊນ', 'ວັນ', 'Lat', 'Lng', 'Google Maps', 'ໝາຍເຫດ', 'ບັນທຶກເມື່ອ'];
  const q = v => /[",\n]/.test(String(v ?? '')) ? `"${String(v).replace(/"/g, '""')}"` : (v ?? '');
  const csv = '﻿' + [head.join(','), ...newList().map(c => cols.map(k => q(cell(k, c[k]))).join(','))].join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv'}));
  a.download = `new_customers_${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
}

function startPicking() {
  stopPlacing();
  picking = true;
  $('bannerText').textContent = 'ຄລິກແຜນທີ່ບ່ອນລູກຄ້າ';
  $('banner').classList.add('show');
  $('map').classList.add('placing');
  if (isPhone()) collapse();
}
// phone sheet has one state at a time: collapsed, half (default) or expanded
function collapse() { body.classList.remove('expanded'); body.classList.add('collapsed'); }

function render() {
  custPopup.remove(); // a customer card would show stale branch/colour after the panel changes
  view === 'list' ? renderList() : view === 'probe' ? renderProbe() : renderPlace(selected);
}

function open(i, fly) {
  stopPlacing(); // a pending place/pick must not apply to a different branch
  if (selected !== i) editing = false;
  const prev = selected;
  selected = i; view = 'place';
  [prev, i].forEach(k => k !== null && markers[k] && markers[k].getElement().classList.toggle('sel', selected === k));
  setDots();
  body.classList.remove('collapsed');
  render();
  $('panelBody').scrollTop = 0;
  if (!markers[i]) { startPlacing(i); return; }
  if (fly || isPhone()) map.flyTo({center: markers[i].getLngLat(), zoom: Math.max(map.getZoom(), 14), padding: pad(), duration: 900});
}
function close() {
  stopPlacing();
  const k = selected;
  selected = null; view = 'list';
  if (k !== null && markers[k]) markers[k].getElement().classList.remove('sel');
  clearProbe();
  $('probeChip').setAttribute('aria-pressed', false);
  setDots();
  render();
}
// keep the target visible beside the panel (desktop) or above the sheet (phone)
const pad = () => isPhone() ? {bottom: innerHeight * .46, top: 110, left: 0, right: 0} :
  {left: body.classList.contains('collapsed') ? 0 : 408, top: 0, right: 0, bottom: 0};

// ---------- placing / moving a pin by clicking the map ----------
function startPlacing(i) {
  stopPlacing();
  placing = i;
  $('bannerText').textContent = `ຄລິກແຜນທີ່ບ່ອນຮ້ານ ${short(B[i]['ສາຂາ'])}`;
  $('banner').classList.add('show');
  $('map').classList.add('placing');
  if (isPhone()) collapse();
}
function stopPlacing() {
  placing = null;
  picking = false;
  $('banner').classList.remove('show');
  $('map').classList.remove('placing');
}
$('cancel').onclick = stopPlacing;
addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (placing !== null || picking) return stopPlacing();
  if (editing && draft && !confirm('ຍົກເລີກການແກ້ໂປຣໄຟລ໌ທີ່ຍັງບໍ່ໄດ້ບັນທຶກ?')) return;
  if (view !== 'list') close();
});
map.on('click', e => {
  if (picking) { stopPlacing(); runProbe(e.lngLat.lat, e.lngLat.lng); return; }
  if (placing === null) return;
  const i = placing;
  setReal(B[i], e.lngLat);
  if (markers[i]) markers[i].setLngLat(e.lngLat); else markers[i] = addMarker(i);
  stopPlacing();
  body.classList.remove('collapsed');
  redraw(i);
  toast(`ວາງ ${short(B[i]['ສາຂາ'])} ແລ້ວ`);
});

// ---------- controls ----------
$('q').addEventListener('input', () => {
  if (/^\s*-?\d|https?:/.test($('q').value)) return; // typing coordinates or a link: wait for Enter
  if (view !== 'list') close(); else render();
  body.classList.remove('collapsed');
});
$('q').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const q = $('q').value.trim(), c = parseCoords(q);
  if (c) { runProbe(c.lat, c.lng); return; }
  const i = B.findIndex(b => q && b['ສາຂາ'].includes(q));
  if (i >= 0) open(i, true);
});
$('probeChip').onclick = () => {
  if (view === 'probe') { close(); return; }
  if (view === 'place') close();
  view = 'probe';
  $('probeChip').setAttribute('aria-pressed', true);
  body.classList.remove('collapsed');
  render();
  $('probeIn').focus();
};
document.querySelectorAll('.chip[data-f]').forEach(c => c.onclick = () => {
  filter = c.dataset.f;
  document.querySelectorAll('.chip[data-f]').forEach(x => x.setAttribute('aria-pressed', x === c));
  if (view !== 'list') close(); else render();
  body.classList.remove('collapsed');
});
$('dotsChip').onclick = () => {
  showDots = !showDots;
  $('dotsChip').setAttribute('aria-pressed', showDots);
  if (map.getLayer('dots')) map.setLayoutProperty('dots', 'visibility', showDots ? 'visible' : 'none');
};
$('menuBtn').onclick = $('toggle').onclick = () => body.classList.contains('collapsed') ? body.classList.remove('collapsed') : collapse();
$('handle').onclick = () => {
  if (body.classList.contains('collapsed')) body.classList.remove('collapsed');
  else body.classList.toggle('expanded');
};
$('zin').onclick = () => map.zoomIn();
$('zout').onclick = () => map.zoomOut();
$('compass').onclick = () => map.easeTo({bearing: 0, pitch: 0});
map.on('rotate', () => $('compass').querySelector('svg').style.transform = `rotate(${-map.getBearing()}deg)`);
$('locate').onclick = () => navigator.geolocation ? navigator.geolocation.getCurrentPosition(
  p => {
    map.flyTo({center: [p.coords.longitude, p.coords.latitude], zoom: 15, padding: pad()});
    new maplibregl.Marker({color: '#1a73e8'}).setLngLat([p.coords.longitude, p.coords.latitude]).addTo(map);
  },
  () => toast('ບໍ່ສາມາດອ່ານຕຳແໜ່ງໄດ້')) : toast('ບຣາວເຊີນີ້ບໍ່ຮອງຮັບຕຳແໜ່ງ');

// layer switcher (Google-style thumbnail that opens a small menu)
function renderLayers() {
  $('layerBtn').className = `layer ${STYLES[styleKey === 'sat' ? 'map' : 'sat'].cls}`;
  $('layerBtn').querySelector('span').textContent = styleKey === 'sat' ? 'ແຜນທີ່' : 'ດາວທຽມ';
  $('layerMenu').innerHTML = '';
  Object.entries(STYLES).forEach(([k, s]) => {
    const btn = document.createElement('button');
    btn.className = `layer ${s.cls}`;
    btn.setAttribute('aria-pressed', k === styleKey);
    btn.innerHTML = `<span>${s.name}</span>`;
    btn.onclick = () => setStyle(k);
    $('layerMenu').appendChild(btn);
  });
}
function setStyle(k) {
  if (k === styleKey) return;
  styleKey = k;
  map.setStyle(STYLES[k].style, {diff: false}); // full reload so style.load fires and re-adds the dots layer
  renderLayers();
}
$('layerBtn').onclick = () => {
  const open = $('layerMenu').classList.toggle('open');
  $('layerBtn').setAttribute('aria-expanded', open);
};
$('layerBtn').ondblclick = () => setStyle(styleKey === 'sat' ? (dark ? 'dark' : 'map') : 'sat');
renderLayers();

let toastTimer;
function toast(msg) {
  $('toast').textContent = msg;
  $('toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('toast').classList.remove('show'), 2600);
}

$('download').onclick = () => {
  const cols = ['ສາຂາ', 'Lat', 'Lng', 'ທີ່ມາ', 'ລູກຄ້າ', 'ສະຖານະ'];
  const q = v => /[",\n]/.test(v) ? `"${String(v).replace(/"/g, '""')}"` : v;
  const csv = '﻿' + [cols.join(','), ...B.map(b => cols.map(c => q(b[c])).join(','))].join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv'}));
  a.download = 'branch_locations.csv';
  a.click();
  toast('ດາວໂຫຼດ branch_locations.csv ແລ້ວ');
};

map.once('load', () => map.easeTo({padding: pad(), duration: 0}));
render();
loadProfiles();
} // end start()

// ---------- PIN gate (web build): no customer data reaches the browser before a valid team PIN ----------
(async function boot() {
  if (EMBEDDED) return start(EMBEDDED);
  const gate = document.getElementById('gate'), msg = document.getElementById('gateMsg'), form = document.getElementById('gateForm');
  const lsGet = k => { try { return localStorage.getItem(k); } catch (_) { return null; } };
  const lsSet = (k, v) => { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (_) { /* private mode */ } };
  const call = async body => {
    try { return await fetch(GATE_API, {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify(body)}).then(r => r.json()); }
    catch (_) { return {ok: false, error: 'network'}; }
  };
  const TEXT = {bad_pin: 'PIN ບໍ່ຖືກ', locked: 'ລັອກຊົ່ວຄາວ ລອງໃໝ່ພາຍຫຼັງ', not_ready: 'ລະບົບຍັງບໍ່ພ້ອມ (ຍັງບໍ່ໄດ້ຕັ້ງ PIN ຫຼື ຂໍ້ມູນແຜນທີ່)',
    network: 'ເຊື່ອມຕໍ່ອິນເຕີເນັດບໍ່ໄດ້ ລອງໃໝ່', server: 'ເຊີບເວີຜິດພາດ ລອງໃໝ່', auth: 'ໝົດເວລາເຂົ້າລະບົບ ກະລຸນາໃສ່ PIN ໃໝ່'};
  const say = r => { msg.textContent = (TEXT[r.error] || 'ຜິດພາດ') + (r.error === 'bad_pin' && r.detail ? ` (ເຫຼືອ ${r.detail} ຄັ້ງ)` : r.error === 'locked' && r.detail ? ` ${r.detail} ນາທີ` : ''); };
  async function load(token) {
    msg.textContent = 'ກຳລັງໂຫຼດແຜນທີ່…';
    const r = await call({action: 'mapdata', token});
    if (!r.ok) { if (r.error === 'auth') lsSet('bp_token', null); say(r); return false; }
    gate.remove();
    start(r.map, token);
    return true;
  }
  const saved = lsGet('bp_token');
  if (saved && await load(saved)) return;
  if (!saved) msg.textContent = '';
  gate.hidden = false;
  document.getElementById('gatePin').focus();
  form.onsubmit = async e => {
    e.preventDefault();
    const btn = form.querySelector('button'); btn.disabled = true;
    msg.textContent = 'ກຳລັງກວດ PIN…';
    const r = await call({action: 'login', pin: document.getElementById('gatePin').value});
    btn.disabled = false;
    if (!r.ok) { say(r); return; }
    lsSet('bp_token', r.token);
    await load(r.token);
  };
})();
</script>
